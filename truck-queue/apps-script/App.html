<script>
/* หน้าเว็บขอคิวรถ — ฟังก์ชันค่าส่ง/วันที่ (policyFee_, thaiDate_ …) ฝังมาจาก Logic.gs */
var B = null;            // ข้อมูลตั้งต้นจาก getBootstrap()
var me = load('tq_me');  // {name, branchCode}
var staff = load('tq_staff'); // {role, pin, actor}
var view = 'request';
var Q = null;            // ผลคำนวณล่าสุดจาก quote()
var pick = null;         // รอบที่เลือก {date, plate}
var PO = [];             // ไฟล์ใบสั่งซื้อที่เลือกไว้ (รูปย่อแล้ว / PDF) [{name, mime, data, url}]
var PO_MAX = 5;

function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function save(k, v) { try { v ? localStorage.setItem(k, JSON.stringify(v)) : localStorage.removeItem(k); } catch (e) {} }
function $(s, el) { return (el || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function money(n) { return Number(n || 0).toLocaleString('th-TH'); }
function branchName(code) { var b = B.branches.filter(function (x) { return x.code === code; })[0]; return b ? b.name : code; }

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, fail) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { fail(e); });
    r[fn].apply(r, args);
  });
}

function toast(msg, bad) {
  var t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, bad ? 6000 : 3500);
}
function fail(e) { toast((e && e.message) || String(e), true); }

/** กล่องถามข้อมูล · fields: [{name, label, type, value, options, required}] → Promise(values|null) */
function ask(title, fields, okLabel) {
  return new Promise(function (resolve) {
    var m = $('#modal');
    m.innerHTML = '<form class="sheet"><h2>' + esc(title) + '</h2>' + fields.map(function (f) {
      var v = esc(f.value == null ? '' : f.value);
      var input = f.type === 'select'
        ? '<select name="' + f.name + '">' + f.options.map(function (o) {
            var val = typeof o === 'object' ? o.value : o, lab = typeof o === 'object' ? o.label : o;
            return '<option value="' + esc(val) + '"' + (String(val) === String(f.value) ? ' selected' : '') + '>' + esc(lab) + '</option>'; }).join('') + '</select>'
        : f.type === 'textarea' ? '<textarea name="' + f.name + '">' + v + '</textarea>'
        : f.type === 'note' ? '<div class="note info">' + esc(f.value) + '</div>'
        : '<input name="' + f.name + '" type="' + (f.type || 'text') + '" value="' + v + '"' + (f.type === 'number' ? ' inputmode="numeric"' : '') + '>';
      return (f.label ? '<label>' + esc(f.label) + (f.required ? '' : ' <span class="opt">(ถ้ามี)</span>') + '</label>' : '') + input;
    }).join('') + '<div class="row" style="margin-top:16px"><button type="button" class="btn ghost" data-x>ปิด</button>' +
      '<button class="btn">' + esc(okLabel || 'บันทึก') + '</button></div></form>';
    m.hidden = false;
    var form = $('form', m);
    $('[data-x]', m).onclick = function () { m.hidden = true; resolve(null); };
    form.onsubmit = function (ev) {
      ev.preventDefault();
      var out = {};
      for (var i = 0; i < fields.length; i++) {
        var f = fields[i]; if (f.type === 'note') continue;
        out[f.name] = form.elements[f.name].value.trim();
        if (f.required && !out[f.name]) { toast('กรุณากรอก ' + f.label, true); return; }
      }
      m.hidden = true; resolve(out);
    };
  });
}

/** ย่อรูปเป็น JPEG ด้านยาวไม่เกิน 1800px ให้ส่งเร็วแต่ยังอ่านตัวหนังสือในใบสั่งซื้อได้ */
function shrink(file) {
  return new Promise(function (ok, bad) {
    var rd = new FileReader();
    rd.onerror = function () { bad(new Error('อ่านไฟล์ ' + file.name + ' ไม่ได้')); };
    rd.onload = function () {
      var img = new Image();
      img.onerror = function () { bad(new Error('ไฟล์ ' + file.name + ' ไม่ใช่รูปที่เปิดได้ (ใช้ JPG/PNG หรือถ่ายรูปใหม่)')); };
      img.onload = function () {
        var k = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        var url = c.toDataURL('image/jpeg', 0.8);
        ok({ name: file.name, mime: 'image/jpeg', data: url.split(',')[1], url: url });
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}
/** PDF ส่งทั้งไฟล์ (ไม่เกิน 4 MB) */
function readPdf(file) {
  return new Promise(function (ok, bad) {
    if (file.size > 4 * 1024 * 1024) return bad(new Error('ไฟล์ ' + file.name + ' ใหญ่เกิน 4 MB'));
    var rd = new FileReader();
    rd.onerror = function () { bad(new Error('อ่านไฟล์ ' + file.name + ' ไม่ได้')); };
    rd.onload = function () { ok({ name: file.name, mime: 'application/pdf', data: String(rd.result).split(',')[1], pdf: true }); };
    rd.readAsDataURL(file);
  });
}
function isPdf(file) { return file.type === 'application/pdf' || /\.pdf$/i.test(file.name); }
function poPayload(list) { return list.map(function (x) { return { name: x.name, mime: x.mime, data: x.data }; }); }

/** ช่องแนบใบสั่งซื้อ (รูป JPG/PNG หรือ PDF): ภาพย่อ + ปุ่มลบ + ปุ่มถ่าย/เลือกไฟล์ · list ถูกแก้ในที่ */
function poPicker(box, list, max) {
  box.innerHTML = '<div class="thumbs">' + list.map(function (x, i) {
    return '<div class="thumb">' + (x.pdf ? '<div class="pdfx"><b>PDF</b><span>' + esc(x.name) + '</span></div>' : '<img src="' + x.url + '" alt="">') +
      '<button type="button" data-rm="' + i + '" aria-label="ลบไฟล์">✕</button></div>';
  }).join('') + (list.length < max ? '<label class="thumb add"><input type="file" accept="image/*,application/pdf,.pdf" multiple hidden><span>＋<br>ถ่ายรูป/<br>เลือกไฟล์</span></label>' : '') + '</div>' +
    '<div class="small muted">' + (list.length ? list.length + ' ไฟล์ · ' : '') + 'JPG, PNG หรือ PDF ไม่เกิน ' + max + ' ไฟล์ · ให้เห็นเลขที่ ยอดเงิน และรายการชัดเจน</div>';
  box.querySelectorAll('[data-rm]').forEach(function (b) { b.onclick = function () { list.splice(+b.dataset.rm, 1); poPicker(box, list, max); }; });
  var inp = $('input[type=file]', box);
  if (inp) inp.onchange = function () {
    var files = Array.prototype.slice.call(inp.files, 0, max - list.length);
    if (inp.files.length > files.length) toast('แนบได้ไม่เกิน ' + max + ' ไฟล์', true);
    box.querySelector('.add span').textContent = 'กำลังเตรียมไฟล์…';
    files.reduce(function (p, file) {
      return p.then(function () { return (isPdf(file) ? readPdf(file) : shrink(file)).then(function (x) { list.push(x); }); });
    }, Promise.resolve()).catch(fail).then(function () { poPicker(box, list, max); });
  };
}

// ───────────────────────────── เริ่มต้น ─────────────────────────────

call('getBootstrap').then(function (b) {
  B = b;
  if (me && !B.sales.some(function (s) { return s.name === me.name && s.branchCode === me.branchCode; })) {
    // ชื่อถูกเปลี่ยน/ปิดโดยคลัง — ให้เลือกใหม่
    if (!B.sales.some(function (s) { return s.branchCode === me.branchCode; })) me = null;
  }
  render();
}).catch(fail);

$('#who').onclick = function () { me = null; save('tq_me', null); view = 'request'; render(); };
$('#staffLink').onclick = function () { staffLogin(); };

function render() {
  var who = $('#who');
  if (staff) {
    who.hidden = false; who.textContent = staff.actor + ' · ' + { wh: 'คลัง', zone: 'ผจก.เขต', ceo: 'CEO', coo: 'COO' }[staff.role] + ' ✕';
    who.onclick = function () { staff = null; save('tq_staff', null); view = 'request'; render(); };
  } else {
    who.hidden = !me; who.textContent = me ? me.name + ' · ' + branchName(me.branchCode) + ' ✎' : '';
    who.onclick = function () { me = null; save('tq_me', null); view = 'request'; render(); };
  }
  if (staff) return renderStaff();
  if (!me) return renderWho();
  var app = $('#app');
  app.innerHTML = '<div class="tabs"><button data-v="request">ขอคิวส่งลูกค้า</button><button data-v="mine">คำขอของสาขา</button></div><div id="pane"></div>';
  app.querySelectorAll('.tabs button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.v === view);
    b.onclick = function () { view = b.dataset.v; render(); };
  });
  if (view === 'mine') renderMine(); else renderForm();
}

// ───────────────────────────── เลือกชื่อ ─────────────────────────────

function renderWho() {
  var app = $('#app');
  var opts = B.branches.map(function (b) { return '<option value="' + b.code + '">' + esc(b.name + ' (' + b.code + ')') + '</option>'; }).join('');
  app.innerHTML = '<div class="card"><h2>คุณคือใคร</h2><p class="muted small">เลือกครั้งเดียว เครื่องนี้จะจำไว้</p>' +
    '<label>สาขา</label><select id="wb"><option value="">— เลือกสาขา —</option>' + opts + '</select>' +
    '<label>ชื่อ</label><select id="wn" disabled><option>— เลือกสาขาก่อน —</option></select>' +
    '<button class="link" id="wadd" hidden>+ ไม่มีชื่อฉันในรายการ</button>' +
    '<button class="btn block" id="wok" disabled>เริ่มใช้งาน</button></div>';
  var wb = $('#wb'), wn = $('#wn');
  wb.onchange = function () {
    var names = B.sales.filter(function (s) { return s.branchCode === wb.value; });
    wn.disabled = !wb.value;
    wn.innerHTML = '<option value="">— เลือกชื่อ —</option>' + names.map(function (s) {
      return '<option value="' + esc(s.name) + '">' + esc(s.name) + (s.manager ? ' (ผจก.สาขา)' : '') + '</option>'; }).join('');
    $('#wadd').hidden = !wb.value; $('#wok').disabled = true;
  };
  wn.onchange = function () { $('#wok').disabled = !wn.value; };
  $('#wadd').onclick = function () {
    ask('เพิ่มชื่อของฉัน', [{ name: 'role', label: 'ตำแหน่ง', type: 'select', required: true,
        options: [{ value: 'ขาย', label: 'พนักงานขาย' }, { value: 'ผจก.สาขา', label: 'ผู้จัดการสาขา' }] },
      { name: 'name', label: 'ชื่อ (ผู้จัดการสาขาใส่ชื่อ-นามสกุล)', required: true },
      { type: 'note', value: 'สาขา: ' + branchName(wb.value) + ' · คลังจะตรวจชื่อใหม่อีกครั้ง' }], 'เพิ่มชื่อ').then(function (v) {
      if (!v) return;
      call('addMyName', v.name, wb.value, v.role).then(function (p) {
        B.sales.push(p); me = p; save('tq_me', me); render();
      }).catch(fail);
    });
  };
  $('#wok').onclick = function () { me = { name: wn.value, branchCode: wb.value }; save('tq_me', me); render(); };
}

// ───────────────────────────── ฟอร์มขอคิว ─────────────────────────────

function renderForm() {
  var b = B.branches.filter(function (x) { return x.code === me.branchCode; })[0] || {};
  var pane = $('#pane');
  if (!b.bookable) {
    pane.innerHTML = '<div class="note warn">สาขา ' + esc(b.name || me.branchCode) + ' ยังไม่เปิดใช้ระบบขอคิว (ช่วงทดลองเปิดเฉพาะบางสาขา) กรุณาใช้วิธีเดิมไปก่อน</div>';
    return;
  }
  PO = [];
  pane.innerHTML = '<div class="note info small">คลังแจ้งผลเวลา <b>10:00</b> และ <b>16:00 น.</b> · <b>ห้ามรับปากวันส่งกับลูกค้า</b>จนกว่าสถานะเป็น "ยืนยันแล้ว" · เลื่อน/ยกเลิกเองได้ถึง 16:00 น. ของวันก่อนส่ง</div>' + '<form id="f" class="card" autocomplete="off">' +
    '<label>ส่งสินค้าให้ลูกค้า</label><div class="seg">' +
      '<label><input type="radio" name="area" value="metro"><span>กรุงเทพฯ และปริมณฑล</span></label>' +
      '<label><input type="radio" name="area" value="up"><span>ต่างจังหวัด</span></label></div>' +
    '<div class="small muted" id="areaHint">ปริมณฑล = นนทบุรี สมุทรปราการ สมุทรสาคร นครปฐม ปทุมธานี</div>' +
    '<label>ลูกค้า / หน่วยงาน</label><input type="text" name="customer">' +
    '<label>ลิงก์ Google Maps ของลูกค้า</label><input type="text" name="mapsUrl" placeholder="https://maps.app.goo.gl/…">' +
    '<label>ที่อยู่ <span class="opt">(ถ้าไม่มีลิงก์ ต้องใส่)</span></label><textarea name="address"></textarea>' +
    '<div class="row"><div><label>มูลค่าสินค้า ก่อน VAT (บาท)</label><input type="number" name="value" min="0" inputmode="decimal"></div>' +
    '<div><label>จำนวนสินค้า</label><input type="text" name="qty" placeholder="เช่น 10 ลัง"></div></div>' +
    '<label>ของอยู่ที่</label><div class="seg">' + B.stockOptions.map(function (o) {
      return '<label><input type="radio" name="stock" value="' + esc(o) + '"><span>' + esc(o) + '</span></label>'; }).join('') + '</div>' +
    '<label class="check"><input type="checkbox" name="lowMargin"> สินค้ากลุ่มกระดาษ / Low Margin (คลังพิจารณาค่าส่งเป็นรายกรณี)</label>' +
    '<label>ใบสั่งซื้อ (รูป/PDF) <span class="opt" id="poReq">(ถ้ามี · ส่งต่างจังหวัดต้องแนบ)</span></label><div id="poBox"></div>' +
    '<button type="button" class="btn ghost block" id="qbtn">ตรวจระยะทาง ค่าส่ง และวันส่ง</button>' +
    '<div id="qres"></div></form>';
  var f = $('#f');
  poPicker($('#poBox'), PO, PO_MAX);
  f.querySelectorAll('input[name=area]').forEach(function (r) { r.onchange = function () { areaChanged(f); }; });
  $('#qbtn').onclick = function () { doQuote(f); };
  ['mapsUrl', 'address'].forEach(function (n) { f.elements[n].oninput = function () { Q = null; pick = null; $('#qres').innerHTML = ''; }; });
  f.elements.value.oninput = function () { if (Q) renderQuote(f); };
  f.elements.lowMargin.onchange = function () { if (Q) renderQuote(f); };
  f.onsubmit = function (ev) { ev.preventDefault(); };
}

function areaOf(f) { return (f.querySelector('input[name=area]:checked') || {}).value || ''; }

/** เปลี่ยนกล่อง กรุงเทพฯ/ต่างจังหวัด: บอกกำหนดล่วงหน้า และช่องใบสั่งซื้อบังคับหรือไม่ */
function areaChanged(f) {
  var a = areaOf(f), st = B.settings;
  $('#areaHint').innerHTML = a === 'up'
    ? '<b>ต่างจังหวัด:</b> ต้องขออนุมัติล่วงหน้าอย่างน้อย <b>' + st.upcountryLeadWorkDays + ' วันทำการ</b> (จ.–ส.) · ต้องแนบใบสั่งซื้อ · อนุมัติ ผจก.เขต → คลัง → CEO → COO'
    : '<b>กรุงเทพฯ และปริมณฑล:</b> งานปกติจองรอบพรุ่งนี้ได้ถ้าขอก่อน ' + st.cutoffHour + ':00 น. · งานที่ต้องอนุมัติ (ยอดต่ำกว่า ' + money(st.minValue) + ' บาทนอกเส้นทาง) ต้องขอล่วงหน้า <b>' + st.approvalLeadWorkDays + ' วันทำการ</b>';
  $('#poReq').textContent = a === 'up' ? '(ต่างจังหวัด — ต้องแนบอย่างน้อย 1 ไฟล์)' : '(ถ้ามี)';
  $('#poReq').className = a === 'up' ? 'req' : 'opt';
  if (Q) { pick = null; renderQuote(f); }
}

function doQuote(f) {
  if (!areaOf(f)) { $('.seg').scrollIntoView({ block: 'center' }); return toast('กรุณาเลือกว่าส่งลูกค้า กรุงเทพฯ และปริมณฑล หรือ ต่างจังหวัด', true); }
  var btn = $('#qbtn'); btn.disabled = true; btn.textContent = 'กำลังคำนวณ…';
  call('quote', { branchCode: me.branchCode, mapsUrl: f.elements.mapsUrl.value, address: f.elements.address.value, value: f.elements.value.value })
    .then(function (q) { Q = q; pick = null; renderQuote(f); })
    .catch(fail)
    .then(function () { btn.disabled = false; btn.textContent = 'คำนวณใหม่'; });
}

function renderQuote(f) {
  var value = Number(f.elements.value.value) || 0;
  var low = f.elements.lowMargin.checked;
  var fee = policyFee_(Q.distanceKm, value, B.settings.tiers, B.settings.ratePer10Km);
  var free = freeKm_(value, B.settings.tiers);
  var out = '';
  var area = areaOf(f);
  if ((area === 'metro') !== Q.metro) {
    var want = Q.metro ? 'metro' : 'up';
    $('#qres').innerHTML = '<div class="note bad">ลูกค้าอยู่ <b>' + esc(Q.province || 'จังหวัดที่ตรวจไม่ได้') + '</b> ซึ่งเป็น<b>' + (Q.metro ? 'กรุงเทพฯ และปริมณฑล' : 'ต่างจังหวัด') +
      '</b> แต่เลือกไว้เป็น' + (area === 'metro' ? 'กรุงเทพฯ และปริมณฑล' : 'ต่างจังหวัด') + ' · ถ้าที่อยู่ถูกต้อง กดเปลี่ยนด้านล่าง ถ้าไม่ถูก ให้แก้ลิงก์แผนที่แล้วตรวจใหม่</div>' +
      (Q.formatted ? '<p class="small muted">ตำแหน่งที่พบ: ' + esc(Q.formatted) + ' · <a target="_blank" href="https://www.google.com/maps?q=' + Q.lat + ',' + Q.lng + '">ดูบนแผนที่</a></p>' : '') +
      '<button type="button" class="btn block" id="fixArea">เปลี่ยนเป็น ' + (Q.metro ? 'กรุงเทพฯ และปริมณฑล' : 'ต่างจังหวัด') + '</button>';
    $('#fixArea').onclick = function () { f.querySelector('input[name=area][value=' + want + ']').checked = true; areaChanged(f); };
    return;
  }
  if (!Q.metro) return renderUpcountry(f, value, low);
  out += '<div class="note ' + (low ? 'info' : fee ? 'warn' : 'ok') + '"><b>' + Q.distanceKm + ' กม.</b> จากสาขา · ' + esc(Q.province) +
    (low ? '<br>สินค้ากลุ่มกระดาษ/Low Margin — คลังพิจารณาค่าส่ง'
      : '<br>ยอด ' + money(value) + ' บาท ส่งฟรี ' + free + ' กม. · <b>ค่าส่งตามนโยบาย ' + money(fee) + ' บาท</b>') + '</div>';
  if (Q.formatted) out += '<p class="small muted">ตำแหน่งที่พบ: ' + esc(Q.formatted) + ' · <a target="_blank" href="https://www.google.com/maps?q=' + Q.lat + ',' + Q.lng + '">ดูบนแผนที่</a></p>';

  out += '<h3>เลือกวันส่ง</h3>';
  if (!Q.rounds.length) out += '<div class="note warn">ช่วง 2 สัปดาห์นี้ไม่มีรอบรถผ่านสาขา ติ๊ก "นอกรอบ/ด่วน" แล้วให้คลังจัดรถให้</div>';
  out += '<div class="rounds">' + Q.rounds.map(function (r, i) {
    var appr = value < B.settings.minValue && !r.onRoute;
    var soon = appr && r.date < Q.approvalEarliest;   // งานต้องอนุมัติ ต้องขอล่วงหน้าตามวันทำการ
    var on = pick && pick.date === r.date && pick.plate === r.plate && !soon;
    return '<button type="button" class="round' + (on ? ' on' : '') + '" data-i="' + i + '"' + (r.left <= 0 || soon ? ' disabled' : '') + '>' +
      '<b>' + esc(r.label) + '</b><small>' + (r.left <= 0 ? 'เต็มแล้ว' : soon ? 'ต้องขอล่วงหน้า ' + Q.approvalLeadWorkDays + ' วันทำการ' : 'เหลือ ' + r.left + ' จุด') + '</small>' +
      (appr ? '<br><span class="badge warn">ต้องอนุมัติ</span>' : r.onRoute ? '<br><span class="badge ok">อยู่บนเส้นทาง</span>' : '') + '</button>';
  }).join('') + '</div>';
  out += '<label class="check"><input type="checkbox" id="urgent"' + (pick && pick.urgent ? ' checked' : '') + '> นอกรอบ / ด่วน (คลังจัดรถเอง)</label>' +
    '<div id="udate"' + (pick && pick.urgent ? '' : ' hidden') + '><label>วันที่ต้องการส่ง' + (value < B.settings.minValue ? ' <span class="opt">(ยอดต่ำ ต้องอนุมัติ — ขอล่วงหน้า ' + Q.approvalLeadWorkDays + ' วันทำการ)</span>' : '') + '</label><input type="date" id="ud" min="' + (value < B.settings.minValue ? Q.approvalEarliest : Q.urgentEarliest) + '" value="' + (pick && pick.urgent ? pick.date : '') + '"></div>';
  var chosen = pick && !pick.urgent ? Q.rounds.filter(function (r) { return r.date === pick.date && r.plate === pick.plate; })[0] : null;
  var needAppr = pick && value < B.settings.minValue && !(chosen && chosen.onRoute);
  if (needAppr) out += '<div class="note warn">ยอดต่ำกว่า ' + money(B.settings.minValue) + ' บาทและอยู่นอกเส้นทาง — ต้องได้รับอนุมัติจาก ผจก.เขต → CEO และ คลัง → COO ก่อนส่ง</div>';

  out += '<h3>รายละเอียดเพิ่มเติม</h3>' +
    '<div class="row"><div><label>ค่าส่งที่เก็บลูกค้า (บาท)</label><input type="number" name="feeCharged" inputmode="numeric" value="' + (low ? '' : fee) + '"></div>' +
    '<div><label>เลขที่ TR <span class="opt">(ถ้ามี)</span></label><input type="text" name="trNo"></div></div>' +
    '<div id="feeWhy" hidden><label>เหตุผลที่เก็บค่าส่งต่ำกว่านโยบาย</label><input type="text" name="feeReason"></div>' +
    '<div class="row"><div><label>เบอร์ผู้รับ <span class="opt">(ถ้ามี)</span></label><input type="tel" name="phone"></div>' +
    '<div><label>เวลาสะดวกรับ <span class="opt">(ถ้ามี)</span></label><input type="text" name="timeWindow" placeholder="เช่น 9:00–12:00"></div></div>' +
    '<label>หมายเหตุ <span class="opt">(ถ้ามี)</span></label><textarea name="note"></textarea>' +
    '<button type="button" class="btn block" id="send">ส่งคำขอ</button>';
  $('#qres').innerHTML = out;

  $('#qres').querySelectorAll('.round').forEach(function (el) {
    el.onclick = function () { var r = Q.rounds[+el.dataset.i]; pick = { date: r.date, plate: r.plate }; renderQuote(f); };
  });
  $('#urgent').onchange = function () {
    pick = this.checked ? { urgent: true, date: '' } : null; renderQuote(f);
  };
  if ($('#ud')) $('#ud').onchange = function () { pick = { urgent: true, date: this.value }; };
  var fc = f.elements.feeCharged;
  var whyCheck = function () { $('#feeWhy').hidden = low || fc.value === '' || Number(fc.value) >= fee; };
  fc.oninput = whyCheck; whyCheck();
  $('#send').onclick = function () { submit(f, fee, low); };
}

/** ปลายทางต่างจังหวัด: ฟอร์มตามใบแจ้งขอรอบรถส่งสินค้าลูกค้าต่างจังหวัด */
function renderUpcountry(f, value, low) {
  var fee = policyFee_(Q.distanceKm, value, B.settings.tiers, Q.ratePer10Km);
  var free = freeKm_(value, B.settings.tiers);
  var keep = function (n) { var el = f.elements[n]; return el ? esc(el.value) : ''; };
  var collect = !f.elements.collectFee || f.elements.collectFee.value !== 'no';
  $('#qres').innerHTML = '<div class="note warn"><b>ปลายทางต่างจังหวัด · ' + esc(Q.province) + ' · ' + Q.distanceKm + ' กม.</b> จากสาขา<br>' +
    'ต้องขออนุมัติตามลำดับ: ผจก.เขต → คลังใส่ค่าขนส่งและยืนยันวันส่ง → CEO → COO</div>' +
    '<div class="note ' + (low ? 'info' : fee ? 'warn' : 'ok') + '">' + (low ? 'สินค้ากลุ่มกระดาษ/Low Margin — พิจารณาค่าส่งเป็นรายกรณี'
      : 'ยอด ' + money(value) + ' บาท ส่งฟรี ' + free + ' กม. · <b>ค่าส่งตามนโยบาย (ต่างจังหวัด ' + Q.ratePer10Km + ' บาท/10 กม.) ' + money(fee) + ' บาท</b>') + '</div>' +
    (Q.formatted ? '<p class="small muted">ตำแหน่งที่พบ: ' + esc(Q.formatted) + ' · <a target="_blank" href="https://www.google.com/maps?q=' + Q.lat + ',' + Q.lng + '">ดูบนแผนที่</a></p>' : '') +
    '<h3>ข้อมูลจากฝ่ายขาย</h3>' + bmField(f) +
    '<div class="row"><div><label>ประเภทสินค้า</label><input type="text" name="productType" value="' + keep('productType') + '" placeholder="เช่น เฟรมผ้าใบ"></div>' +
    '<div><label>เบอร์ติดต่อลูกค้า</label><input type="tel" name="phone" value="' + keep('phone') + '"></div></div>' +
    '<div class="row"><div><label>กำไรขั้นต้น (บาท)</label><input type="number" name="grossProfit" inputmode="decimal" value="' + keep('grossProfit') + '"></div>' +
    '<div><label>เลขที่ใบสั่งซื้อ <span class="opt">(ถ้ามี)</span></label><input type="text" name="poNo" value="' + keep('poNo') + '"></div></div>' +
    '<div id="gpPct" class="small muted"></div>' +
    '<label>เก็บค่าส่งลูกค้า</label><div class="seg">' +
      '<label><input type="radio" name="collectFee" value="yes"' + (collect ? ' checked' : '') + '><span>เก็บ</span></label>' +
      '<label><input type="radio" name="collectFee" value="no"' + (collect ? '' : ' checked') + '><span>ไม่เก็บ</span></label></div>' +
    '<div class="row" id="feeRow"' + (collect ? '' : ' hidden') + '><div><label>ค่าส่งที่เก็บ (บาท)</label><input type="number" name="feeCharged" inputmode="numeric" value="' + (low ? '' : fee) + '"></div>' +
    '<div><label>เลขที่ TR <span class="opt">(ถ้ามี)</span></label><input type="text" name="trNo" value="' + keep('trNo') + '"></div></div>' +
    '<div id="feeWhy" hidden><label>เหตุผลที่เก็บค่าส่งต่ำกว่านโยบาย</label><input type="text" name="feeReason" value="' + keep('feeReason') + '"></div>' +
    '<label>วันที่ลูกค้าต้องการ <span class="opt">(ขออนุมัติล่วงหน้าอย่างน้อย ' + Q.upcountryLeadWorkDays + ' วันทำการ · เร็วสุด ' + esc(thaiDate_(Q.upcountryEarliest)) + ' · คลังจะยืนยันวันส่งจริง)</span></label><input type="date" id="ud" min="' + Q.upcountryEarliest + '" value="' + (pick && pick.date ? pick.date : '') + '">' +
    '<label>หมายเหตุ <span class="opt">(ถ้ามี)</span></label><textarea name="note">' + keep('note') + '</textarea>' +
    '<button type="button" class="btn block" id="send">ส่งขออนุมัติ</button>';
  var gp = f.elements.grossProfit;
  var pct = function () { var g = Number(gp.value); $('#gpPct').textContent = value > 0 && gp.value !== '' ? 'กำไรขั้นต้น ' + (Math.round(g / value * 1000) / 10) + '% ของยอดขาย' : ''; };
  gp.oninput = pct; pct();
  var fc = f.elements.feeCharged;
  var whyCheck = function () {
    var yes = (f.querySelector('input[name=collectFee]:checked') || {}).value !== 'no';
    $('#feeRow').hidden = !yes;
    $('#feeWhy').hidden = low || (yes && (fc.value === '' || Number(fc.value) >= fee));
  };
  f.querySelectorAll('input[name=collectFee]').forEach(function (r) { r.onchange = whyCheck; });
  fc.oninput = whyCheck; whyCheck();
  $('#ud').onchange = function () { pick = { upcountry: true, date: this.value }; };
  $('#send').onclick = function () { submitUpcountry(f, fee, low); };
  $('#addBm').onclick = function () {
    ask('เพิ่มชื่อผู้จัดการสาขา', [{ name: 'name', label: 'ชื่อ-นามสกุล ผู้จัดการสาขา', required: true },
      { type: 'note', value: 'สาขา: ' + branchName(me.branchCode) + ' · คลังจะตรวจชื่อใหม่อีกครั้ง' }], 'เพิ่มชื่อ').then(function (v) {
      if (!v) return;
      call('addMyName', v.name, me.branchCode, 'ผจก.สาขา').then(function (p) {
        B.sales.push(p);
        renderQuote(f);
        f.elements.branchManager.value = p.name;
      }).catch(fail);
    });
  };
}

/** ผู้ขอรอบรถต่างจังหวัด = ผู้จัดการสาขา (พนักงานขายกรอกแทนได้) */
function bmField(f) {
  var mgrs = B.sales.filter(function (x) { return x.manager && x.branchCode === me.branchCode; });
  var cur = f.elements.branchManager ? f.elements.branchManager.value : (mgrs.some(function (x) { return x.name === me.name; }) ? me.name : '');
  return '<label>ผู้ขอรอบรถ (ผู้จัดการสาขา)</label><select name="branchManager"><option value="">— เลือกผู้จัดการสาขา —</option>' +
    mgrs.map(function (x) { return '<option value="' + esc(x.name) + '"' + (x.name === cur ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') +
    '</select><button type="button" class="link" id="addBm">+ ไม่มีชื่อผู้จัดการสาขาในรายการ</button>' +
    (!mgrs.some(function (x) { return x.name === me.name; }) ? '<div class="small muted">กรอกโดย ' + esc(me.name) + ' · ชื่อผู้จัดการสาขาจะขึ้นในช่อง "ขอรอบรถโดย" บนใบแจ้ง</div>' : '');
}

function submitUpcountry(f, fee, low) {
  var e = f.elements;
  var stock = (f.querySelector('input[name=stock]:checked') || {}).value;
  var collect = (f.querySelector('input[name=collectFee]:checked') || {}).value !== 'no';
  if (!e.customer.value.trim()) return toast('กรุณาใส่ชื่อลูกค้า', true);
  if (!(Number(e.value.value) > 0)) return toast('กรุณาใส่มูลค่าสินค้า', true);
  if (!e.qty.value.trim()) return toast('กรุณาใส่จำนวนสินค้า', true);
  if (!stock) return toast('กรุณาเลือกว่าของอยู่ที่ไหน', true);
  if (!e.branchManager.value) return toast('กรุณาเลือกผู้จัดการสาขาที่เป็นผู้ขอรอบรถ', true);
  if (!e.productType.value.trim()) return toast('กรุณาใส่ประเภทสินค้า', true);
  if (!e.phone.value.trim()) return toast('กรุณาใส่เบอร์ติดต่อลูกค้า', true);
  if (e.grossProfit.value === '') return toast('กรุณาใส่กำไรขั้นต้น', true);
  if (!PO.length) { $('#poBox').scrollIntoView({ block: 'center' }); return toast('ส่งต่างจังหวัดต้องแนบใบสั่งซื้ออย่างน้อย 1 ไฟล์ (รูปหรือ PDF)', true); }
  if (!pick || !pick.date) return toast('กรุณาเลือกวันที่ลูกค้าต้องการ', true);
  var fc = collect ? e.feeCharged.value : '0';
  if (!low && Number(fc || fee) < fee && !e.feeReason.value.trim()) return toast('กรุณาใส่เหตุผลที่เก็บค่าส่งต่ำกว่านโยบาย', true);
  var btn = $('#send'); btn.disabled = true; btn.textContent = 'กำลังส่ง…';
  call('submitRequest', {
    requester: me.name, branchCode: me.branchCode, area: areaOf(f), customer: e.customer.value, mapsUrl: e.mapsUrl.value,
    address: e.address.value, value: e.value.value, qty: e.qty.value, stock: stock, lowMargin: e.lowMargin.checked,
    date: pick.date, branchManager: e.branchManager.value, productType: e.productType.value, phone: e.phone.value, grossProfit: e.grossProfit.value,
    poNo: e.poNo.value, collectFee: collect, feeCharged: fc, feeReason: e.feeReason.value, trNo: e.trNo.value, note: e.note.value,
    poFiles: poPayload(PO)
  }).then(function (r) {
    Q = null; pick = null; PO = [];
    $('#pane').innerHTML = '<div class="card center"><h2>ส่งขออนุมัติแล้ว</h2><p>เลขคิว <b>' + esc(r.id) + '</b></p>' +
      '<p>วันที่ลูกค้าต้องการ ' + esc(r.dateLabel) + '</p><p><span class="badge warn">' + esc(r.status) + '</span></p>' +
      '<p class="small muted">ติดตามที่แท็บ "คำขอของสาขา" · คลังจะใส่ค่าขนส่งและยืนยันวันส่งจริงหลัง ผจก.เขต อนุมัติ แล้วส่งต่อ CEO และ COO</p>' +
      '<button class="btn block" id="again">ขอคิวรายการใหม่</button><button class="btn ghost block" id="tomine">ดูคำขอของสาขา</button></div>';
    $('#again').onclick = function () { render(); };
    $('#tomine').onclick = function () { view = 'mine'; render(); };
  }).catch(function (err) { fail(err); btn.disabled = false; btn.textContent = 'ส่งขออนุมัติ'; });
}

function submit(f, fee, low) {
  var e = f.elements;
  var stock = (f.querySelector('input[name=stock]:checked') || {}).value;
  if (!e.customer.value.trim()) return toast('กรุณาใส่ชื่อลูกค้า', true);
  if (!(Number(e.value.value) > 0)) return toast('กรุณาใส่มูลค่าสินค้า', true);
  if (!e.qty.value.trim()) return toast('กรุณาใส่จำนวนสินค้า', true);
  if (!stock) return toast('กรุณาเลือกว่าของอยู่ที่ไหน', true);
  if (!pick || !pick.date) return toast('กรุณาเลือกวันส่ง', true);
  if (!low && e.feeCharged.value !== '' && Number(e.feeCharged.value) < fee && !e.feeReason.value.trim()) return toast('กรุณาใส่เหตุผลที่เก็บค่าส่งต่ำกว่านโยบาย', true);
  var btn = $('#send'); btn.disabled = true; btn.textContent = 'กำลังส่ง…';
  call('submitRequest', {
    requester: me.name, branchCode: me.branchCode, area: areaOf(f), customer: e.customer.value, mapsUrl: e.mapsUrl.value,
    address: e.address.value, value: e.value.value, qty: e.qty.value, stock: stock, lowMargin: e.lowMargin.checked,
    urgent: !!pick.urgent, date: pick.date, plate: pick.plate || '', feeCharged: e.feeCharged.value,
    feeReason: e.feeReason.value, trNo: e.trNo.value, phone: e.phone.value, timeWindow: e.timeWindow.value, note: e.note.value,
    poFiles: poPayload(PO)
  }).then(function (r) {
    Q = null; pick = null; PO = [];
    $('#pane').innerHTML = '<div class="card center"><h2>ส่งคำขอแล้ว</h2><p>เลขคิว <b>' + esc(r.id) + '</b></p>' +
      '<p>วันส่ง ' + esc(r.dateLabel) + '</p><p><span class="badge ' + (r.status === STATUS.APPROVAL ? 'warn' : 'info') + '">' + esc(r.status) + '</span></p>' +
      '<p class="small muted">คลังแจ้งผลเวลา 10:00 และ 16:00 น. · ยังไม่ต้องรับปากลูกค้าจนกว่าสถานะเป็น "ยืนยันแล้ว"</p>' +
      '<button class="btn block" id="again">ขอคิวรายการใหม่</button><button class="btn ghost block" id="tomine">ดูคำขอของสาขา</button></div>';
    $('#again').onclick = function () { render(); };
    $('#tomine').onclick = function () { view = 'mine'; render(); };
  }).catch(function (err) { fail(err); btn.disabled = false; btn.textContent = 'ส่งคำขอ'; });
}

// ───────────────────────────── คำขอของสาขา ─────────────────────────────

var BADGE = {};
BADGE[STATUS.PENDING] = 'info'; BADGE[STATUS.APPROVAL] = 'warn'; BADGE[STATUS.CONFIRMED] = 'ok';
BADGE[STATUS.DELIVERED] = 'ok'; BADGE[STATUS.FAILED] = 'bad'; BADGE[STATUS.CANCELLED] = ''; BADGE[STATUS.REJECTED] = 'bad';

function statusBadge(s) { return '<span class="badge ' + (BADGE[s] || '') + '">' + esc(s) + '</span>'; }

function apprLine(a, up) {
  var mark = function (v) { return !v ? '…' : v.indexOf('ไม่อนุมัติ') === 0 ? '✗' : '✓'; };
  return up ? 'ผจก.เขต ' + mark(a.zone) + ' → คลังค่าขนส่ง ' + mark(a.wh) + ' → CEO ' + mark(a.ceo) + ' → COO ' + mark(a.coo)
    : 'ขาย: ผจก.เขต ' + mark(a.zone) + ' → CEO ' + mark(a.ceo) + ' · คลัง ' + mark(a.wh) + ' → COO ' + mark(a.coo);
}

function renderMine() {
  var pane = $('#pane'); pane.innerHTML = '<p class="muted center">กำลังโหลด…</p>';
  call('branchRequests', me.branchCode).then(function (list) {
    if (!list.length) { pane.innerHTML = '<p class="muted center">ยังไม่มีคำขอใน 30 วันที่ผ่านมา</p>'; return; }
    pane.innerHTML = list.map(function (r) {
      var canCancel = r.canChange;
      var canAttach = [STATUS.PENDING, STATUS.APPROVAL, STATUS.CONFIRMED].indexOf(r.status) !== -1 && r.poCount < PO_MAX;
      return '<div class="card"><div class="item"><div><div class="title">' + esc(r.customer) + '</div>' +
        '<div class="small muted">' + esc(r.id) + ' · ' + esc(r.requester) + ' · ' + esc(r.qty) + '</div>' +
        (r.upcountry ? '<span class="badge warn">ต่างจังหวัด · ' + esc(r.province) + '</span>' : '') + '</div>' + statusBadge(r.status) + '</div>' +
        '<div class="small">' + (r.upcountry && !r.plate ? 'วันที่ขอ' : 'วันส่ง') + ' <b>' + esc(r.dateLabel) + '</b>' + (r.plate ? ' · ' + esc(r.plate) : r.urgent ? ' · นอกรอบ/ด่วน' : '') +
        (Number(r.feeCharged) ? ' · ค่าส่ง ' + money(r.feeCharged) + ' บาท' : '') + '</div>' +
        (r.needsApproval ? '<div class="small muted">' + apprLine(r.approvals, r.upcountry) + '</div>' : '') +
        (r.reason ? '<div class="note warn small">' + esc(r.reason) + '</div>' : '') +
        (r.canChange ? '<div class="small muted">เลื่อน/ยกเลิกเองได้ถึง ' + esc(r.changeDeadline) + '</div>'
          : [STATUS.PENDING, STATUS.APPROVAL, STATUS.CONFIRMED].indexOf(r.status) !== -1 ? '<div class="small muted">เลยเวลาเลื่อน/ยกเลิกเองแล้ว · ติดต่อคลัง</div>' : '') +
        '<div class="actions">' + (r.canMove ? '<button class="btn small ghost" data-mv="' + esc(r.id) + '">เลื่อนวันส่ง</button>' : '') +
        (canCancel ? '<button class="btn bad small" data-c="' + esc(r.id) + '">ยกเลิกคำขอ</button>' : '') +
        (r.formUrl ? '<a class="btn small ghost" target="_blank" href="' + esc(r.formUrl) + '">ใบแจ้ง (พิมพ์)</a>' : '') +
        (r.poUrl ? '<a class="btn small ghost" target="_blank" href="' + esc(r.poUrl) + '">ใบสั่งซื้อ (' + r.poCount + ' ไฟล์)</a>' : '') +
        (canAttach ? '<button class="btn small ghost" data-po="' + esc(r.id) + '" data-n="' + r.poCount + '">＋ แนบใบสั่งซื้อ</button>' : '') + '</div></div>';
    }).join('');
    pane.querySelectorAll('[data-c]').forEach(function (b) {
      b.onclick = function () {
        if (!confirm('ยกเลิกคำขอ ' + b.dataset.c + ' ?')) return;
        call('cancelMine', b.dataset.c, me.name).then(function () { toast('ยกเลิกแล้ว'); renderMine(); }).catch(fail);
      };
    });
    pane.querySelectorAll('[data-po]').forEach(function (b) { b.onclick = function () { attachForm(b.dataset.po, +b.dataset.n); }; });
    pane.querySelectorAll('[data-mv]').forEach(function (b) { b.onclick = function () { moveForm(b.dataset.mv); }; });
  }).catch(fail);
}

/** สาขาเลื่อนวันส่ง: เลือกรอบใหม่จากรอบที่ผ่านพื้นที่ลูกค้า (คลังต้องยืนยันใหม่) */
function moveForm(id) {
  toast('กำลังหารอบที่เลื่อนได้…');
  call('moveOptions', id).then(function (o) {
    var ok = o.rounds.filter(function (r) { return r.left > 0 && !r.tooSoon; });
    if (!ok.length) return toast('ไม่มีรอบว่างใน 2 สัปดาห์นี้ กรุณาติดต่อคลัง', true);
    ask('เลื่อนวันส่ง · ' + id, [
      { type: 'note', value: 'เลื่อนแล้วสถานะกลับเป็น "รอยืนยัน" ให้คลังยืนยันใหม่' + (ok.some(function (r) { return r.needsApproval; }) ? ' · รอบที่มีป้าย "ต้องอนุมัติ" จะเริ่มขออนุมัติใหม่' : '') },
      { name: 'round', label: 'รอบใหม่', type: 'select', required: true, options: ok.map(function (r) {
        return { value: r.date + '|' + r.plate, label: r.label + ' · ' + r.plate + ' · เหลือ ' + r.left + ' จุด' + (r.needsApproval ? ' · ต้องอนุมัติ' : '') };
      }) }
    ], 'เลื่อนวัน').then(function (v) {
      if (!v) return;
      var p = v.round.split('|');
      call('moveMine', id, me.name, p[0], p[1]).then(function (r) { toast('เลื่อนเป็น ' + r.dateLabel + ' แล้ว · รอคลังยืนยัน'); renderMine(); }).catch(fail);
    });
  }).catch(fail);
}

// ───────────────────────────── คลัง / ผู้อนุมัติ ─────────────────────────────

function staffLogin() {
  ask('เข้าสู่ระบบสำหรับคลัง / ผู้อนุมัติ', [
    { name: 'role', label: 'กลุ่ม', type: 'select', required: true,
      options: [{ value: 'wh', label: 'คลังสินค้า' }, { value: 'zone', label: 'ผู้จัดการเขต' }, { value: 'ceo', label: 'CEO' }, { value: 'coo', label: 'COO' }] },
    { name: 'pin', label: 'PIN', type: 'password', required: true }
  ], 'ถัดไป').then(function (v) {
    if (!v) return;
    call('staffCheck', v.role, v.pin).then(function () {
      var names = v.role === 'wh' ? B.warehouse : v.role === 'zone' ? B.zoneManagers : [v.role === 'ceo' ? 'CEO' : 'COO'];
      if (names.length === 1) return finish(names[0]);
      ask('คุณคือใคร', [{ name: 'actor', label: 'ชื่อ', type: 'select', options: names, required: true }], 'เข้าใช้งาน')
        .then(function (a) { if (a) finish(a.actor); });
      function finish(actor) {
        staff = { role: v.role, pin: v.pin, actor: actor }; save('tq_staff', staff);
        view = v.role === 'wh' ? 'board' : 'approve'; render();
      }
    }).catch(fail);
  });
}

function renderStaff() {
  var tabs = staff.role === 'wh'
    ? [['board', 'งานส่ง'], ['approve', 'รออนุมัติ'], ['confirm', 'แจ้งสาขา'], ['sheets', 'ใบงาน/ปิดรอบ'], ['names', 'รายชื่อใหม่']]
    : [['approve', 'รออนุมัติ']];
  if (!tabs.some(function (t) { return t[0] === view; })) view = tabs[0][0];
  $('#app').innerHTML = '<div class="tabs">' + tabs.map(function (t) {
    return '<button data-v="' + t[0] + '" class="' + (t[0] === view ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><div id="pane"></div>';
  $('#app').querySelectorAll('.tabs button').forEach(function (b) { b.onclick = function () { view = b.dataset.v; render(); }; });
  ({ board: renderBoard, approve: renderApprove, sheets: renderSheets, names: renderNames, confirm: renderConfirm })[view]();
}

/** แนบใบสั่งซื้อเพิ่มให้คำขอที่ส่งไปแล้ว */
function attachForm(id, have) {
  var list = [], m = $('#modal');
  m.innerHTML = '<div class="sheet"><h2>แนบใบสั่งซื้อ · ' + esc(id) + '</h2><div id="poAdd"></div>' +
    '<div class="row" style="margin-top:16px"><button type="button" class="btn ghost" data-x>ปิด</button><button type="button" class="btn" id="poSave">บันทึกไฟล์</button></div></div>';
  m.hidden = false;
  poPicker($('#poAdd'), list, PO_MAX - have);
  $('[data-x]', m).onclick = function () { m.hidden = true; };
  $('#poSave').onclick = function () {
    if (!list.length) return toast('กรุณาถ่ายรูปหรือเลือกไฟล์ใบสั่งซื้อ', true);
    var btn = this; btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    call('attachPo', id, me.name, me.branchCode, poPayload(list)).then(function () {
      m.hidden = true; toast('แนบไฟล์แล้ว'); renderMine();
    }).catch(function (e) { fail(e); btn.disabled = false; btn.textContent = 'บันทึกไฟล์'; });
  };
}

function staffFail(e) {
  if (/PIN/.test((e && e.message) || '')) { staff = null; save('tq_staff', null); render(); }
  fail(e);
}

function detailKv(r) {
  var rows = [['สาขา', r.branchName + ' · ' + r.requester], ['ที่อยู่', r.address], ['ระยะ', (r.distanceKm || '-') + ' กม. · ' + (r.province || '')],
    ['สินค้า', r.qty + ' · ' + money(r.value) + ' บาท · ของอยู่ที่' + r.stock],
    ['ค่าส่ง', r.lowMargin ? 'กระดาษ/Low Margin · เก็บ ' + money(r.feeCharged) : 'นโยบาย ' + money(r.feePolicy) + ' · เก็บ ' + money(r.feeCharged) + (r.feeReason ? ' (' + r.feeReason + ')' : '')],
    ['TR', r.trNo], ['ผู้รับ', [r.phone, r.timeWindow].filter(String).join(' · ')], ['หมายเหตุ', r.note]];
  if (r.upcountry) {
    if (r.branchManager) rows.splice(1, 0, ['ผู้ขอรอบรถ', r.branchManager + ' (ผจก.สาขา) · กรอกโดย ' + r.requester]);
    rows.splice(1, 0, ['ต่างจังหวัด', (r.productType || '') + (r.poNo ? ' · PO ' + r.poNo : '') + ' · กำไรขั้นต้น ' + money(r.grossProfit) +
      ' บาท' + (r.grossProfitPct !== '' && r.grossProfitPct != null ? ' (' + r.grossProfitPct + '%)' : '') + (r.collectFee ? '' : ' · ไม่เก็บค่าส่ง')]);
    if (r.cost) rows.push(['ประมาณการ', 'รวม ' + money(r.cost.total) + ' บาท (น้ำมัน ' + money(r.cost.fuel) + ' · ค่าเสื่อม ' + money(r.cost.depreciation) +
      ' · ค่าแรง ' + money(r.cost.labor) + ' · ทางด่วน ' + money(r.cost.toll) + ' · ที่พัก ' + money(r.cost.lodging) + ' · อื่นๆ ' + money(r.cost.other) + ')' +
      ' · ไป-กลับ ' + r.cost.roundTripKm + ' กม. ' + r.cost.days + ' วัน ' + r.cost.staff + ' คน' +
      (r.cost.privateCost ? ' · ขนส่งเอกชน ' + money(r.cost.privateCost) + ' บาท' + (r.cost.privateCost < r.cost.total ? ' (ถูกกว่า)' : '') : '') +
      (r.cost.branchGoods ? ' · มีสินค้ารวมส่งสาขา ' + money(r.cost.branchGoodsValue) + ' บาท' : '') +
      (r.cost.scheduleImpact ? ' · กระทบตารางประจำวัน: ' + (r.cost.impactNote || '-') : ' · ไม่กระทบตารางประจำวัน') +
      (r.cost.departTime ? ' · ออกจากคลัง ' + r.cost.departTime : '')]);
  }
  return '<dl class="kv">' + rows.filter(function (x) { return x[1]; }).map(function (x) {
    return '<dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') +
    (r.mapsUrl ? '<dt>แผนที่</dt><dd><a target="_blank" href="' + esc(r.mapsUrl) + '">เปิดลิงก์</a></dd>' : '') +
    '<dt>ใบสั่งซื้อ</dt><dd>' + (r.poUrl ? '<a target="_blank" href="' + esc(r.poUrl) + '">ดู ' + r.poCount + ' ไฟล์</a>' : '<span class="muted">ไม่ได้แนบ</span>') + '</dd></dl>';
}

var boardFrom = null;
function renderBoard() {
  var pane = $('#pane');
  boardFrom = boardFrom || B.today;
  pane.innerHTML = '<div class="row"><div><label>ตั้งแต่</label><input type="date" id="bf" value="' + boardFrom + '"></div>' +
    '<div><label>ถึง</label><input type="date" id="bt" value="' + addDays_(boardFrom, 7) + '"></div></div><div id="blist"><p class="muted center">กำลังโหลด…</p></div>';
  var reload = function () { boardFrom = $('#bf').value; loadBoard($('#bf').value, $('#bt').value); };
  $('#bf').onchange = reload; $('#bt').onchange = reload;
  loadBoard(boardFrom, addDays_(boardFrom, 7));
}

function loadBoard(from, to) {
  call('whBoard', staff.pin, from, to).then(function (d) {
    var plates = d.trucks.map(function (t) { return { value: t.plate, label: t.plate + (t.driver ? ' · ' + t.driver : '') }; });
    var html = '';
    if (d.reschedule.length) html += '<h3>งานที่ต้องจัดใหม่ (ตารางรอบรถเปลี่ยน) <span class="count">' + d.reschedule.length + '</span></h3>' + d.reschedule.map(cardWh).join('');
    var late = d.requests.filter(function (r) { return r.date < d.today; });
    if (late.length) html += '<h3>เลยวันส่งแล้ว ยังไม่ปิด <span class="count">' + late.length + '</span></h3>' + late.map(cardWh).join('');
    var byDate = {};
    d.requests.filter(function (r) { return r.date >= d.today; }).forEach(function (r) { (byDate[r.date] = byDate[r.date] || []).push(r); });
    Object.keys(byDate).sort().forEach(function (date) {
      var list = byDate[date].sort(function (a, b) { return String(a.plate).localeCompare(String(b.plate)); });
      var pend = list.filter(function (r) { return r.status === STATUS.PENDING; }).length;
      html += '<h3>' + esc(thaiDate_(date)) + (pend ? ' <span class="count">' + pend + '</span>' : '') + '</h3>' + list.map(cardWh).join('');
    });
    if (d.newStaff.length) html = '<div class="note info">มีชื่อพนักงานใหม่ ' + d.newStaff.length + ' ชื่อ รอตรวจที่แท็บ "รายชื่อใหม่"</div>' + html;
    $('#blist').innerHTML = html || '<p class="muted center">ไม่มีงานในช่วงนี้</p>';
    bindWh(plates, d);
  }).catch(staffFail);

  function cardWh(r) {
    var late = r.date < B.today && (r.status === STATUS.PENDING || r.status === STATUS.CONFIRMED || r.status === STATUS.APPROVAL);
    var acts = [];
    if (r.status === STATUS.PENDING) acts.push(['confirm', 'ยืนยัน', '']);
    if ([STATUS.PENDING, STATUS.CONFIRMED, STATUS.APPROVAL].indexOf(r.status) !== -1) acts.push(['move', 'ย้ายวัน/รถ', 'ghost'], ['cancel', 'ยกเลิก', 'bad']);
    if (r.status === STATUS.CONFIRMED) acts.push(['fail', 'ส่งไม่สำเร็จ', 'bad']);
    acts.push(['edit', 'แก้ค่าส่ง/TR', 'ghost']);
    if (r.upcountry && r.status === STATUS.APPROVAL && !r.approvals.wh) acts.unshift(['cost', r.cost ? 'แก้ค่าขนส่ง (ใบแจ้ง)' : 'กรอกค่าขนส่ง (ใบแจ้ง)', '']);
    return '<div class="card' + (late ? ' late' : '') + '"><div class="item"><div><div class="title">' + esc(r.customer) + '</div>' +
      '<div class="small muted">' + esc(r.id) + ' · ' + (r.plate ? esc(r.plate) : r.urgent ? 'นอกรอบ/ด่วน — ยังไม่มีรถ' : 'ยังไม่มีรถ') + ' · ' + esc(r.dateLabel) + '</div></div>' +
      statusBadge(r.status) + '</div>' +
      (r.underPolicy ? '<span class="badge warn">เก็บค่าส่งต่ำกว่านโยบาย</span> ' : '') + (r.lowMargin ? '<span class="badge info">กระดาษ/Low Margin</span> ' : '') +
      (r.needsApproval ? '<div class="small muted">' + apprLine(r.approvals, r.upcountry) + '</div>' : '') +
      detailKv(r) + (r.reason ? '<div class="note warn small">' + esc(r.reason) + '</div>' : '') +
      '<div class="actions">' + (r.formUrl ? '<a class="btn small ghost" target="_blank" href="' + esc(r.formUrl) + '">ใบแจ้ง (พิมพ์)</a>' : '') + acts.map(function (a) {
        return '<button class="btn small ' + a[2] + '" data-a="' + a[0] + '" data-id="' + esc(r.id) + '" data-date="' + r.date + '" data-plate="' + esc(r.plate || '') + '" data-fee="' + esc(r.feeCharged) + '" data-tr="' + esc(r.trNo || '') + '">' + a[1] + '</button>';
      }).join('') + '</div></div>';
  }

  function bindWh(plates, d) {
    $('#blist').querySelectorAll('[data-a]').forEach(function (b) {
      b.onclick = function () {
        var a = b.dataset.a, id = b.dataset.id, ds = b.dataset;
        if (a === 'cost') return costForm(d.requests.concat(d.reschedule).filter(function (x) { return x.id === id; })[0], d.trucks, 'save');
        var fields = {
          confirm: [{ name: 'date', label: 'วันส่ง', type: 'date', value: ds.date, required: true },
            { name: 'plate', label: 'รถ', type: 'select', options: plates, value: ds.plate, required: true }],
          move: [{ name: 'date', label: 'วันส่งใหม่', type: 'date', value: ds.date, required: true },
            { name: 'plate', label: 'รถ', type: 'select', options: [{ value: '', label: '— ยังไม่ระบุ —' }].concat(plates), value: ds.plate },
            { name: 'reason', label: 'เหตุผล (คนขอจะเห็น)', required: true }],
          cancel: [{ name: 'reason', label: 'เหตุผลที่ยกเลิก', required: true }],
          fail: [{ name: 'reason', label: 'เหตุผลที่ส่งไม่สำเร็จ', required: true }],
          edit: [{ name: 'feeCharged', label: 'ค่าส่งที่เก็บ (บาท)', type: 'number', value: ds.fee },
            { name: 'trNo', label: 'เลขที่ TR', value: ds.tr }, { name: 'reason', label: 'เหตุผลค่าส่ง' }]
        }[a];
        ask(b.textContent + ' · ' + id, fields).then(function (v) {
          if (!v) return;
          call('whUpdate', staff.pin, staff.actor, id, a, v).then(function () { toast('บันทึกแล้ว'); renderBoard(); }).catch(staffFail);
        });
      };
    });
  }
}

function renderApprove() {
  var pane = $('#pane'); pane.innerHTML = '<p class="muted center">กำลังโหลด…</p>';
  Promise.all([call('approvals', staff.role, staff.pin, staff.actor), staff.role === 'wh' ? call('whBoard', staff.pin, B.today, B.today) : null])
    .then(function (res) {
      var list = res[0], trucks = res[1] ? res[1].trucks : [];
      if (!list.length) { pane.innerHTML = '<p class="muted center">ไม่มีรายการรออนุมัติ</p>'; return; }
      pane.innerHTML = '<div class="note info">งานยอดต่ำกว่า ' + money(B.settings.minValue) + ' บาทที่อยู่นอกเส้นทาง: ถ้าอนุมัติไม่ครบภายใน ' + B.settings.cutoffHour +
        ':00 น. ของวันก่อนส่ง ระบบจะเลื่อนไปรอบถัดไป · งานต่างจังหวัด: อนุมัติตามลำดับ ผจก.เขต → คลังใส่ค่าขนส่ง → CEO → COO</div>' + list.map(function (r) {
        var soon = r.date <= addDays_(B.today, 1);
        return '<div class="card' + (soon ? ' late' : '') + '"><div class="item"><div><div class="title">' + esc(r.customer) + '</div>' +
          '<div class="small muted">' + esc(r.id) + ' · ส่ง ' + esc(r.dateLabel) + ' · ' + esc(r.plate || 'ยังไม่มีรถ') + '</div></div>' + statusBadge(r.status) + '</div>' +
          '<div class="small muted">' + apprLine(r.approvals, r.upcountry) + '</div>' +
          (r.verdict ? '<div class="note ' + (r.verdictGood ? 'ok' : 'bad') + '"><b>' + esc(r.verdict) + '</b></div>' : '') + detailKv(r) +
          (r.upcountry ? '<span class="badge warn">ต่างจังหวัด · ' + esc(r.province) + '</span>' : '') +
          '<div class="actions"><button class="btn small" data-ok="' + esc(r.id) + '" data-date="' + r.date + '" data-plate="' + esc(r.plate || '') + '">อนุมัติ</button>' +
          '<button class="btn small bad" data-no="' + esc(r.id) + '">ไม่อนุมัติ</button>' + (r.formUrl ? '<a class="btn small ghost" target="_blank" href="' + esc(r.formUrl) + '">ใบแจ้ง (พิมพ์)</a>' : '') + '</div></div>';
      }).join('');
      pane.querySelectorAll('[data-ok]').forEach(function (b) {
        b.onclick = function () {
          var item = list.filter(function (x) { return x.id === b.dataset.ok; })[0];
          if (staff.role === 'wh' && item && item.upcountry) return costForm(item, trucks);
          var fields = [{ name: 'reason', label: 'หมายเหตุ' }];
          if (staff.role === 'wh') fields = [{ name: 'date', label: 'วันส่ง', type: 'date', value: b.dataset.date, required: true },
            { name: 'plate', label: 'รถ', type: 'select', value: b.dataset.plate, required: true,
              options: trucks.map(function (t) { return { value: t.plate, label: t.plate + (t.driver ? ' · ' + t.driver : '') }; }) }].concat(fields);
          ask('อนุมัติ ' + b.dataset.ok, fields, 'อนุมัติ').then(function (v) {
            if (!v) return;
            call('decide', staff.role, staff.pin, staff.actor, b.dataset.ok, true, v.reason, { date: v.date, plate: v.plate })
              .then(function () { toast('อนุมัติแล้ว'); renderApprove(); }).catch(staffFail);
          });
        };
      });
      pane.querySelectorAll('[data-no]').forEach(function (b) {
        b.onclick = function () {
          ask('ไม่อนุมัติ ' + b.dataset.no, [{ name: 'reason', label: 'เหตุผล (คนขอจะเห็น)', required: true }], 'ไม่อนุมัติ').then(function (v) {
            if (!v) return;
            call('decide', staff.role, staff.pin, staff.actor, b.dataset.no, false, v.reason, null)
              .then(function () { toast('บันทึกแล้ว'); renderApprove(); }).catch(staffFail);
          });
        };
      });
    }).catch(staffFail);
}

/** คลังประเมินค่าใช้จ่ายส่งต่างจังหวัด แล้วอนุมัติฝั่งคลัง (ตามใบแจ้งกระดาษ ส่วน "ข้อมูลจากคลังสินค้า") */
/** ค่าขนส่งตามใบแจ้ง (ส่วนคลังสินค้า) · mode 'save' = บันทึกไว้ก่อน ยังไม่อนุมัติ · อื่นๆ = อนุมัติฝั่งคลัง */
function costForm(r, trucks, mode) {
  var st = B.settings, m = $('#modal'), c0 = r.cost || {}, save = mode === 'save';
  var v = function (k, d) { return c0[k] != null && c0[k] !== '' ? c0[k] : d; };
  var num = function (n, label, v, opt) {
    return '<div><label>' + label + (opt ? ' <span class="opt">(ถ้ามี)</span>' : '') + '</label><input type="number" inputmode="decimal" name="' + n + '" value="' + (v == null ? '' : v) + '"></div>';
  };
  m.innerHTML = '<form class="sheet"><h2>ค่าขนส่งตามใบแจ้ง · ' + esc(r.id) + '</h2>' +
    (save ? '<p class="note info small">บันทึกไว้ก่อนได้ ยังไม่ถือว่าอนุมัติ · แก้ได้จนกว่าคลังจะกดอนุมัติ (หลัง ผจก.เขต อนุมัติ) จากนั้นส่งต่อ CEO และ COO</p>' : '') +
    '<p class="small muted">' + esc(r.customer) + ' · ' + esc(r.province) + ' · วันที่ลูกค้าต้องการ ' + esc(r.dateLabel) + '</p>' +
    '<div class="row"><div><label>วันส่งจริง</label><input type="date" name="date" value="' + r.date + '"></div>' +
    '<div><label>เวลาออกจากคลัง</label><input type="text" name="departTime" placeholder="เช่น 9:00" value="' + esc(v('departTime', '')) + '"></div></div>' +
    '<label>รถ</label><select name="plate">' + trucks.map(function (t) { return '<option value="' + esc(t.plate) + '"' + (t.plate === r.plate ? ' selected' : '') + '>' + esc(t.plate + (t.driver ? ' · ' + t.driver : '')) + '</option>'; }).join('') + '</select>' +
    '<div class="row">' + num('roundTripKm', 'ระยะไป-กลับ (กม.)', v('roundTripKm', r.whRoundTripKm || '')) + num('kmPerLiter', 'อัตราสิ้นเปลือง (กม./ลิตร)', v('kmPerLiter', st.kmPerLiter)) + '</div>' +
    '<div class="row">' + num('fuelPrice', 'ราคาน้ำมัน (บาท/ลิตร)', v('fuelPrice', st.fuelPrice)) + num('days', 'จำนวนวันไป-กลับ', v('days', 1)) + '</div>' +
    '<div class="row">' + num('staff', 'จำนวนพนักงาน', v('staff', 2)) + num('labor', 'ค่าแรง/OT/เบี้ยเลี้ยง (บาท)', v('labor', 0)) + '</div>' +
    '<div class="row">' + num('toll', 'ค่าทางด่วน (บาท)', v('toll', 0)) + num('lodging', 'ค่าที่พัก (บาท)', v('lodging', 0)) + '</div>' +
    '<div class="row">' + num('other', 'อื่นๆ (บาท)', v('other', 0)) + num('privateCost', 'ถ้าใช้ขนส่งเอกชน (บาท)', v('privateCost', '') || '', true) + '</div>' +
    '<label class="check"><input type="checkbox" name="branchGoods"' + (c0.branchGoods ? ' checked' : '') + '> มีสินค้ารวมส่งให้สาขาต่างจังหวัด</label>' +
    '<div id="bgv" hidden>' + num('branchGoodsValue', 'มูลค่าสินค้าที่ส่งสาขา (บาท)', v('branchGoodsValue', '') || '') + '</div>' +
    '<label class="check"><input type="checkbox" name="scheduleImpact"' + (c0.scheduleImpact ? ' checked' : '') + '> กระทบตารางส่งของประจำวัน</label>' +
    '<div id="imp" hidden><label>กระทบอย่างไร</label><input type="text" name="impactNote" value="' + esc(v('impactNote', '')) + '"></div>' +
    '<div class="note info" id="sum"></div>' +
    (save ? '' : '<label>หมายเหตุ <span class="opt">(ถ้ามี)</span></label><input type="text" name="reason">') +
    '<div class="row" style="margin-top:16px"><button type="button" class="btn ghost" data-x>ปิด</button><button class="btn">' + (save ? 'บันทึกค่าขนส่ง' : 'อนุมัติฝั่งคลัง · ส่งต่อ CEO') + '</button></div></form>';
  m.hidden = false;
  var f = $('form', m), e = f.elements;
  var read = function () {
    var c = {};
    ['roundTripKm', 'kmPerLiter', 'fuelPrice', 'days', 'staff', 'labor', 'toll', 'lodging', 'other', 'privateCost', 'branchGoodsValue']
      .forEach(function (k) { c[k] = e[k].value; });
    c.depreciationPerKm = st.depreciationPerKm;
    c.branchGoods = e.branchGoods.checked; c.scheduleImpact = e.scheduleImpact.checked;
    c.impactNote = e.impactNote.value; c.departTime = e.departTime.value;
    return c;
  };
  var upd = function () {
    var x = upcountryCost_(read());
    $('#bgv').hidden = !e.branchGoods.checked; $('#imp').hidden = !e.scheduleImpact.checked;
    $('#sum').innerHTML = 'น้ำมัน ' + money(x.fuel) + ' + ค่าเสื่อม ' + money(x.depreciation) + ' (' + st.depreciationPerKm + ' บาท/กม.) + ค่าแรง + ทางด่วน + ที่พัก + อื่นๆ<br><b>รวมประมาณการ ' + money(x.total) + ' บาท</b>' +
      (x.privateCost ? ' · ขนส่งเอกชน ' + money(x.privateCost) + ' บาท' + (x.cheaperPrivate ? ' <b>(เอกชนถูกกว่า)</b>' : '') : '') +
      (r.feeCharged ? '<br>ค่าส่งที่เก็บลูกค้า ' + money(r.feeCharged) + ' บาท' : '');
  };
  f.oninput = upd; f.onchange = upd; upd();
  $('[data-x]', m).onclick = function () { m.hidden = true; };
  f.onsubmit = function (ev) {
    ev.preventDefault();
    if (!(Number(e.roundTripKm.value) > 0)) return toast('กรุณาใส่ระยะไป-กลับ', true);
    if (!e.date.value) return toast('กรุณาเลือกวันส่งจริง', true);
    if (save) return call('whSaveCost', staff.pin, staff.actor, r.id, { date: e.date.value, plate: e.plate.value, cost: read() })
      .then(function () { m.hidden = true; toast('บันทึกค่าขนส่งแล้ว (ยังไม่อนุมัติ)'); renderBoard(); }).catch(staffFail);
    call('decide', 'wh', staff.pin, staff.actor, r.id, true, e.reason.value.trim(), { date: e.date.value, plate: e.plate.value, cost: read() })
      .then(function () { m.hidden = true; toast('อนุมัติฝั่งคลังแล้ว ส่งต่อ CEO → COO'); renderApprove(); }).catch(staffFail);
  };
}

/** แจ้งสาขา: รายงานยืนยันรอบส่งล่วงหน้า 1 วัน (อีเมล หรือคัดลอกไปวาง LINE) */
var confirmDate = null;
function renderConfirm() {
  confirmDate = confirmDate || addDays_(B.today, 1);
  var pane = $('#pane');
  pane.innerHTML = '<div class="note info small">ส่งยืนยันให้สาขาก่อนวันส่ง 1 วัน (หลังยืนยันงานครบ ก่อน 16:00 น.) · สาขาที่มีอีเมลในชีต "อีเมลแจ้งเตือน" กดส่งอีเมลได้ · ใช้ LINE ให้กด "คัดลอกข้อความ" แล้ววางในกลุ่มสาขา</div>' +
    '<label>วันส่ง</label><input type="date" id="cd" value="' + confirmDate + '"><div id="clist"><p class="muted center">กำลังโหลด…</p></div>';
  $('#cd').onchange = function () { confirmDate = this.value; renderConfirm(); };
  call('confirmReport', staff.pin, confirmDate).then(function (list) {
    if (!list.length) { $('#clist').innerHTML = '<p class="muted center">ไม่มีงานส่งในวันนี้</p>'; return; }
    var ready = list.filter(function (b) { return b.emails.length && b.confirmed === b.total; });
    $('#clist').innerHTML = (ready.length ? '<button class="btn block" id="sendAll">ส่งอีเมลทุกสาขาที่ยืนยันครบ (' + ready.length + ' สาขา)</button>' : '') +
      list.map(function (b) {
        var pend = b.total - b.confirmed;
        return '<div class="card"><div class="item"><div><div class="title">' + esc(b.branchName) + ' <span class="muted small">(' + esc(b.code) + ')</span></div>' +
          '<div class="small muted">' + b.total + ' รายการ · ยืนยันแล้ว ' + b.confirmed + (pend ? ' · <b style="color:var(--warn)">ยังไม่ยืนยัน ' + pend + '</b>' : '') + '</div>' +
          '<div class="small muted">' + (b.emails.length ? 'อีเมล: ' + esc(b.emails.join(', ')) : 'ยังไม่มีอีเมลสาขา (ใช้ LINE ได้)') + '</div>' +
          (b.lastSent ? '<div class="small" style="color:var(--green)">ส่งอีเมลแล้ว ' + esc(b.lastSent) + '</div>' : '') + '</div>' +
          (pend ? '<span class="badge warn">ยืนยันยังไม่ครบ</span>' : '<span class="badge ok">พร้อมแจ้ง</span>') + '</div>' +
          '<div class="actions">' + (b.emails.length ? '<button class="btn small" data-send="' + esc(b.code) + '">ส่งอีเมล</button>' : '') +
          '<button class="btn small ghost" data-copy="' + esc(b.code) + '">คัดลอกข้อความ (LINE)</button>' +
          '<a class="btn small ghost" target="_blank" href="' + esc(b.url) + '">เปิดรายงาน</a></div></div>';
      }).join('');
    var byCode = {};
    list.forEach(function (b) { byCode[b.code] = b; });
    var send = function (codes, btn) {
      var warn = codes.filter(function (c) { return byCode[c].confirmed < byCode[c].total; });
      if (warn.length && !confirm('สาขา ' + warn.map(function (c) { return byCode[c].branchName; }).join(', ') + ' ยังยืนยันไม่ครบ ส่งเลยไหม?')) return;
      btn.disabled = true;
      call('sendBranchConfirm', staff.pin, staff.actor, confirmDate, codes).then(function (res) {
        var ok = res.filter(function (x) { return x.ok; }).length, bad = res.filter(function (x) { return !x.ok; });
        toast('ส่งอีเมลแล้ว ' + ok + ' สาขา' + (bad.length ? ' · ไม่สำเร็จ: ' + bad.map(function (x) { return byCode[x.code].branchName + ' (' + x.why + ')'; }).join(', ') : ''), !!bad.length);
        renderConfirm();
      }).catch(function (e) { btn.disabled = false; staffFail(e); });
    };
    $('#clist').querySelectorAll('[data-send]').forEach(function (b) { b.onclick = function () { send([b.dataset.send], b); }; });
    if ($('#sendAll')) $('#sendAll').onclick = function () { send(ready.map(function (b) { return b.code; }), this); };
    $('#clist').querySelectorAll('[data-copy]').forEach(function (b) {
      b.onclick = function () {
        var text = byCode[b.dataset.copy].text;
        var done = function () { toast('คัดลอกแล้ว · วางในกลุ่ม LINE ของสาขาได้เลย'); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { showText(text); });
        else showText(text);
      };
    });
  }).catch(staffFail);
}
/** คัดลอกอัตโนมัติไม่ได้ (บางเบราว์เซอร์) → แสดงข้อความให้กดค้างคัดลอกเอง */
function showText(text) {
  var m = $('#modal');
  m.innerHTML = '<div class="sheet"><h2>ข้อความแจ้งสาขา</h2><p class="small muted">กดค้างเพื่อคัดลอก แล้ววางใน LINE</p><textarea style="min-height:240px" readonly>' + esc(text) +
    '</textarea><button class="btn block ghost" data-x>ปิด</button></div>';
  m.hidden = false;
  $('textarea', m).select();
  $('[data-x]', m).onclick = function () { m.hidden = true; };
}

var sheetDate = null;
function renderSheets() {
  sheetDate = sheetDate || addDays_(B.today, 1);
  var pane = $('#pane');
  pane.innerHTML = '<label>วันที่</label><input type="date" id="sd" value="' + sheetDate + '"><div id="slist"><p class="muted center">กำลังโหลด…</p></div>';
  $('#sd').onchange = function () { sheetDate = this.value; renderSheets(); };
  call('dailySheets', staff.pin, sheetDate).then(function (list) {
    $('#slist').innerHTML = list.length ? list.map(function (s) {
      return '<div class="card"><div class="item"><div><div class="title">' + esc(s.plate) + '</div><div class="small muted">' + esc(s.driver || '') +
        ' · ' + s.count + ' จุดส่งลูกค้า' + (s.pending ? ' · <b style="color:var(--warn)">ยังไม่ยืนยัน ' + s.pending + '</b>' : '') + '</div></div></div>' +
        '<div class="actions"><a class="btn small" target="_blank" href="' + esc(s.url) + '&print=1">พิมพ์ใบงาน</a>' +
        '<a class="btn small ghost" target="_blank" href="' + esc(s.url) + '">เปิดบนมือถือ</a>' +
        '<button class="btn small ghost" data-close="' + esc(s.plate) + '">ปิดรอบ</button></div></div>';
    }).join('') : '<p class="muted center">วันนี้ไม่มีรอบรถ</p>';
    $('#slist').querySelectorAll('[data-close]').forEach(function (b) { b.onclick = function () { closeRound(b.dataset.close); }; });
  }).catch(staffFail);
}

function closeRound(plate) {
  call('whBoard', staff.pin, sheetDate, sheetDate).then(function (d) {
    var stops = d.requests.filter(function (r) { return r.plate === plate && r.date === sheetDate && r.status === STATUS.CONFIRMED; });
    if (!stops.length) return toast('ไม่มีงาน "ยืนยันแล้ว" ของรถคันนี้ในวันที่เลือก', true);
    var m = $('#modal');
    m.innerHTML = '<div class="sheet"><h2>ปิดรอบ ' + esc(plate) + ' · ' + esc(thaiDate_(sheetDate)) + '</h2>' +
      '<p class="small muted">ทุกจุดจะเป็น "จัดส่งเรียบร้อย" ยกเว้นจุดที่ติ๊กว่าส่งไม่สำเร็จ</p>' + stops.map(function (r) {
        return '<div class="card"><label class="check"><input type="checkbox" data-f="' + esc(r.id) + '"> ส่งไม่สำเร็จ — ' + esc(r.customer) + '</label>' +
          '<input type="text" data-why="' + esc(r.id) + '" placeholder="เหตุผล" hidden></div>';
      }).join('') + '<div class="row"><button class="btn ghost" data-x>ปิด</button><button class="btn" data-go>ปิดรอบ</button></div></div>';
    m.hidden = false;
    m.querySelectorAll('[data-f]').forEach(function (c) { c.onchange = function () { m.querySelector('[data-why="' + c.dataset.f + '"]').hidden = !c.checked; }; });
    $('[data-x]', m).onclick = function () { m.hidden = true; };
    $('[data-go]', m).onclick = function () {
      var failed = {}, missing = false;
      m.querySelectorAll('[data-f]:checked').forEach(function (c) {
        var why = m.querySelector('[data-why="' + c.dataset.f + '"]').value.trim();
        if (!why) missing = true; failed[c.dataset.f] = why;
      });
      if (missing) return toast('กรุณาใส่เหตุผลของจุดที่ส่งไม่สำเร็จ', true);
      call('whCloseRound', staff.pin, staff.actor, sheetDate, plate, failed).then(function (r) {
        m.hidden = true; toast('ปิดรอบแล้ว · ส่งเรียบร้อย ' + r.delivered + ' · ไม่สำเร็จ ' + r.failed); renderSheets();
      }).catch(staffFail);
    };
  }).catch(staffFail);
}

function renderNames() {
  var pane = $('#pane'); pane.innerHTML = '<p class="muted center">กำลังโหลด…</p>';
  call('whBoard', staff.pin, B.today, B.today).then(function (d) {
    if (!d.newStaff.length) { pane.innerHTML = '<p class="muted center">ไม่มีชื่อใหม่รอตรวจ</p>'; return; }
    pane.innerHTML = '<p class="small muted">ชื่อที่พนักงานเพิ่มเอง · ถ้าซ้ำกับชื่อเดิม ให้แก้ชื่อให้ตรงกัน หรือปิดชื่อนี้</p>' + d.newStaff.map(function (p, i) {
      return '<div class="card"><div class="title">' + esc(p.name) + '</div><div class="small muted">' + esc(p.role === 'ผจก.สาขา' ? 'ผู้จัดการสาขา' : p.role === 'คลัง' ? 'คลัง' : 'พนักงานขาย') + ' · ' + esc(branchName(p.branchCode)) + ' · เพิ่มเมื่อ ' + esc(p.createdAt) + '</div>' +
        '<div class="actions"><button class="btn small" data-op="approve" data-i="' + i + '">ยืนยันชื่อ</button>' +
        '<button class="btn small ghost" data-op="rename" data-i="' + i + '">แก้ชื่อ</button>' +
        '<button class="btn small bad" data-op="close" data-i="' + i + '">ปิดชื่อนี้</button></div></div>';
    }).join('');
    pane.querySelectorAll('[data-op]').forEach(function (b) {
      b.onclick = function () {
        var p = d.newStaff[+b.dataset.i];
        var go = function (newName) {
          call('staffAdmin', staff.pin, staff.actor, b.dataset.op, p.name, p.branchCode, newName || '')
            .then(function () { toast('บันทึกแล้ว'); renderNames(); }).catch(staffFail);
        };
        if (b.dataset.op === 'rename') ask('แก้ชื่อ ' + p.name, [{ name: 'n', label: 'ชื่อที่ถูกต้อง', value: p.name, required: true }]).then(function (v) { if (v) go(v.n); });
        else go();
      };
    });
  }).catch(staffFail);
}
</script>
