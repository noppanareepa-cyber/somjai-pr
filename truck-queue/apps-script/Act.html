<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Sarabun', system-ui, sans-serif; font-size: 16px; color: #111; background: #eef1ee; }
    header { background: #1f7a3a; color: #fff; padding: 12px 16px; font-weight: 700; font-size: 18px; }
    main { max-width: 560px; margin: 0 auto; padding: 14px 16px 28px; }
    .card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 6px 4px; border-bottom: 1px solid #eee; vertical-align: top; }
    td:first-child { color: #555; white-space: nowrap; padding-right: 10px; }
    .verdict { font-size: 18px; font-weight: 700; margin: 12px 0 4px; }
    .good { color: #1f7a3a; } .bad { color: #a3261d; }
    .links a { color: #1f7a3a; margin-right: 14px; }
    button { font: 600 17px 'Sarabun', sans-serif; width: 100%; padding: 14px; border-radius: 10px; border: 0; color: #fff; margin-top: 10px; cursor: pointer; }
    .ok { background: #1f7a3a; } .no { background: #a3261d; } .ghost { background: #fff; color: #555; border: 1px solid #ccc; }
    button:disabled { opacity: .5; }
    textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid #ccc; border-radius: 8px; min-height: 70px; margin-top: 6px; }
    .msg { padding: 14px; border-radius: 10px; margin-top: 12px; font-weight: 600; }
    .msg.okm { background: #e6f2e9; color: #1f7a3a; } .msg.err { background: #fbe9e7; color: #a3261d; }
    .muted { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <header>ระบบขอคิวรถคลังสินค้า · สมใจ</header>
  <main id="m"></main>
  <script>
    var D = <?!= data ?>;
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
    var m = document.getElementById('m');
    function render() {
      if (!D.ok) { m.innerHTML = '<div class="msg err">' + esc(D.error) + '</div>'; return; }
      var s = D.summary;
      m.innerHTML = '<div class="card"><div class="muted">' + esc(D.roleLabel) + ' · ' + esc(s.kind) + '</div>' +
        '<table>' + s.rows.map(function (x) { return '<tr><td>' + esc(x[0]) + '</td><td>' + esc(x[1]) + '</td></tr>'; }).join('') + '</table>' +
        (s.verdict ? '<div class="verdict ' + (s.good ? 'good' : 'bad') + '">' + esc(s.verdict) + '</div>' : '') +
        '<div class="links">' + (D.poUrl ? '<a href="' + esc(D.poUrl) + '" target="_blank">ดูใบสั่งซื้อ</a>' : '') +
        (D.formUrl ? '<a href="' + esc(D.formUrl) + '" target="_blank">ดูใบแจ้งเต็ม</a>' : '') + '</div></div>' +
        (!D.pending ? '<div class="msg okm">รายการนี้ไม่ต้องรอ ' + esc(D.roleLabel) + ' แล้ว (สถานะ: ' + esc(D.status) + ')</div>' :
          D.approve ? '<button class="ok" id="go">ยืนยัน อนุมัติ</button><button class="ghost" id="sw">เปลี่ยนเป็น ไม่อนุมัติ</button>'
            : '<label>เหตุผลที่ไม่อนุมัติ (สาขาจะเห็น)</label><textarea id="why"></textarea>' +
              '<button class="no" id="go">ยืนยัน ไม่อนุมัติ</button><button class="ghost" id="sw">เปลี่ยนเป็น อนุมัติ</button>') +
        '<div id="out"></div>';
      if (!D.pending) return;
      document.getElementById('sw').onclick = function () { D.approve = !D.approve; render(); };
      document.getElementById('go').onclick = function () {
        var why = D.approve ? '' : document.getElementById('why').value.trim();
        if (!D.approve && !why) { out('กรุณาใส่เหตุผลที่ไม่อนุมัติ', true); return; }
        var b = this; b.disabled = true; b.textContent = 'กำลังบันทึก…';
        google.script.run.withSuccessHandler(function (r) {
          D.pending = false; D.status = r.status; render();
          out((D.approve ? 'อนุมัติแล้ว' : 'บันทึกไม่อนุมัติแล้ว') + ' · สถานะตอนนี้: ' + r.status, false);
        }).withFailureHandler(function (e) {
          b.disabled = false; b.textContent = D.approve ? 'ยืนยัน อนุมัติ' : 'ยืนยัน ไม่อนุมัติ'; out(e.message || String(e), true);
        }).emailDecide(D.id, D.role, D.exp, D.t, D.approve, why);
      };
    }
    function out(msg, bad) { document.getElementById('out').innerHTML = '<div class="msg ' + (bad ? 'err' : 'okm') + '">' + esc(msg) + '</div>'; }
    render();
  </script>
</body>
</html>
