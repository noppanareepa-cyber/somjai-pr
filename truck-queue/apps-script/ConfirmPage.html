<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Sarabun', system-ui, sans-serif; font-size: 15px; color: #111; background: #eef1ee; }
    .page { max-width: 210mm; margin: 12px auto; padding: 14px 16px 18px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.12); }
    .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; border-bottom: 2px solid #1f7a3a; padding-bottom: 6px; }
    .logo { font: 700 26px/1 'Sarabun', sans-serif; color: #1f7a3a; }
    h1 { font-size: 18px; margin: 10px 0 2px; }
    .sub { color: #555; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ddd; padding: 6px 6px; text-align: left; vertical-align: top; }
    th { background: #eef4ef; font-size: 14px; }
    .muted { color: #666; font-size: 13px; }
    .ok { color: #1f7a3a; font-weight: 600; } .wait { color: #9a5b00; font-weight: 600; }
    .note { margin-top: 10px; padding: 8px 10px; background: #fff4e0; color: #7a4a00; border-radius: 6px; font-size: 14px; }
    .bar { text-align: center; margin: 12px; }
    .bar button { font: 600 15px 'Sarabun', sans-serif; padding: 8px 18px; border-radius: 8px; border: 1px solid #1f7a3a; background: #1f7a3a; color: #fff; cursor: pointer; }
    @media print { body { background: #fff; } .bar { display: none; } .page { box-shadow: none; margin: 0; max-width: none; } }
    @media (max-width: 600px) { th:nth-child(2), td:nth-child(2) { display: none; } }
  </style>
</head>
<body>
  <div class="bar"><button onclick="print()">พิมพ์</button></div>
  <div class="page" id="p"></div>
  <script>
    var D = <?!= data ?>;
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
    var pend = D.items.length - D.confirmed;
    document.getElementById('p').innerHTML =
      '<div class="top"><div class="logo">สมใจ</div><div class="muted">คลังสินค้า · รายงานยืนยันรอบส่ง</div></div>' +
      '<h1>ยืนยันรอบส่งสินค้า ' + esc(D.dateLabel) + '</h1>' +
      '<div class="sub">สาขา' + esc(D.branchName) + ' (' + esc(D.code) + ') · ' + D.items.length + ' รายการ' + (pend ? ' · <span class="wait">ยังไม่ยืนยัน ' + pend + '</span>' : '') + '</div>' +
      (D.items.length ? '<table><tr><th>#</th><th>เลขคิว</th><th>ลูกค้า</th><th>สินค้า</th><th>รถ / คนขับ</th><th>สถานะ</th></tr>' + D.items.map(function (x, i) {
        return '<tr><td>' + (i + 1) + '</td><td class="muted">' + esc(x.id) + '</td><td>' + esc(x.customer) +
          (x.timeWindow ? '<div class="muted">เวลารับ ' + esc(x.timeWindow) + '</div>' : '') + (x.upcountry ? '<div class="muted">ต่างจังหวัด</div>' : '') + '</td>' +
          '<td>' + esc(x.qty) + '</td><td>' + esc(x.plate || 'รอจัดรถ') + (x.driver ? '<div class="muted">' + esc(x.driver) + '</div>' : '') + '</td>' +
          '<td class="' + (x.confirmed ? 'ok' : 'wait') + '">' + esc(x.confirmed ? x.status : 'ยังไม่ยืนยัน') + '</td></tr>';
      }).join('') + '</table>' : '<p>ไม่มีงานส่งของสาขานี้ในวันนี้</p>') +
      '<div class="note">กรุณาแจ้งลูกค้าตามวันส่งนี้ · รายการ "ยังไม่ยืนยัน" ห้ามรับปากลูกค้า · ถ้ามีเปลี่ยนแปลงติดต่อคลังโดยตรง</div>';
  </script>
</body>
</html>
